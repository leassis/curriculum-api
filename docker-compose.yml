# Local Postgres for development. Run: pnpm db:up
services:
  db:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: curriculum
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d curriculum"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
