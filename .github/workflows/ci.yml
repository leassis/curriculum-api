name: CI

on:
  pull_request:
    paths-ignore: &ignore
      - "**/*.md"
      - ".specs/**"
      - "curriculum-specs/**"
      - "docs/**"
      - "release-please-config.json"
      - ".release-please-manifest.json"
  push:
    branches: [main]
    paths-ignore: *ignore

# One run per ref; a new push cancels the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Neon Local (docker compose) forks an ephemeral branch of PARENT_BRANCH_ID;
      # the integration tests run on a Testcontainers Postgres container;
      # the Neon variables are for the docker compose step only.
      DATABASE_URL: postgres://neon:npg@localhost:5432/neondb
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      PARENT_BRANCH_ID: ${{ secrets.PARENT_BRANCH_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Neon Local, the same service as local development
      - name: Start database services
        run: docker compose up -d --wait
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Migrate with the packaged CLI
        run: node dist/cli.js migrate
