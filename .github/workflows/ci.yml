name: CI

on:
  pull_request:
    paths-ignore: &ignore
      - "**/*.md"
      - ".specs/**"
      - "curriculum-specs/**"
      - "docs/**"
      - "release-please-config.json"
      - ".release-please-manifest.json"
  push:
    branches: [main]
    paths-ignore: *ignore

# One run per ref; a new push cancels the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # The compose Postgres, the same service as local development;
      # the integration tests run on a Testcontainers Postgres container.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/curriculum
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The compose Postgres, the same service as local development
      - name: Start database services
        run: docker compose up -d --wait
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Migrate with the packaged CLI
        run: node dist/cli.js migrate
